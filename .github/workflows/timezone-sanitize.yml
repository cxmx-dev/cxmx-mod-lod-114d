# OPSEC: fail CI when public text still carries timezone strings (CST/EST/…, full names, UTC±N).
name: timezone-sanitize

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only token: this job only checks out and scans.
permissions:
  contents: read

jobs:
  timezone-sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for timezone strings (public text)
        shell: bash
        run: |
          chmod +x scripts/sanitize-timezones.sh
          ./scripts/sanitize-timezones.sh --check .
