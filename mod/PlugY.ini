[LAUNCHING]
Param=
Library=PlugY.dll


[GENERAL]
ActivePlugin=1
; Battle.net click returns immediately. Leave this at 1.
DisableBattleNet=1
ActiveLogFile=0
DllToLoad=BaseMod.dll
DllToLoad2=cxmxdev.dll
ActiveCommands=1
ActiveCheckMemory=1
; Unfinished switches. PlugY 14.03 says leave this at 0.
ActiveAllOthersFeatures=0


[WINDOWED]
; Stays 0. The play script sizes the window. Turning this on fights that script.
ActiveWindowed=0
RemoveBorder=0
WindowOnTop=0
Maximized=0
SetWindowPos=0
X=0
Y=0
Width=0
Height=0
LockMouseOnStartup=0


[LANGUAGE]
;ENG|ESP|DEU|FRA|POR|ITA|JPN|KOR|SIN|CHI|POL|RUS
ActiveChangeLanguage=0
SelectedLanguage=ENG
; Off keeps the install language. On locks the list below.
ActiveLanguageManagement=0
DefaultLanguage=ENG
AvailableLanguages=ENG|ESP|DEU|FRA|POR|ITA|JPN|KOR|SIN|CHI|POL|RUS


[SAVEPATH]
ActiveSavePathChange=1
SavePath=Save\

ActiveAutoBackup=1
MaxBackupPerCharacter=20


[MAIN SCREEN]
ActiveVersionTextChange=1
VersionText=
ColorOfVersionText=0

ActivePrintPlugYVersion=1
ColorOfPlugYVersion=4


[STASH]
ActiveBigStash=1

ActiveMultiPageStash=1
NbPagesPerIndex=10
NbPagesPerIndex2=100
MaxPersonnalPages=0
AutoRenameStashPage=1
PersonalNormalPageColor=0
PersonalIndexPageColor=12
PersonalMainIndexPageColor=9
SharedNormalPageColor=4
SharedIndexPageColor=8
SharedMainIndexPageColor=1

ActiveSharedStash=1
ActiveSharedStashInMultiPlayer=1
SeparateHardcoreStash=1
OpenSharedStashOnLoading=1
; File name inside Save. Renaming this starts an empty shared stash.
SharedStashFilename=SharedStashSave
DisplaySharedSetItemNameInGreen=1
MaxSharedPages=0
ActiveSharedGold=1
; -1 keeps PlugY's built-in spot. A pixel value moves that one control.
PosXPreviousBtn=-1
PosYPreviousBtn=-1
PosWPreviousBtn=32
PosHPreviousBtn=32
PosXNextBtn=-1
PosYNextBtn=-1
PosWNextBtn=32
PosHNextBtn=32
PosXSharedBtn=-1
PosYSharedBtn=-1
PosWSharedBtn=32
PosHSharedBtn=32
PosXPreviousIndexBtn=-1
PosYPreviousIndexBtn=-1
PosWPreviousIndexBtn=32
PosHPreviousIndexBtn=32
PosXNextIndexBtn=-1
PosYNextIndexBtn=-1
PosWNextIndexBtn=32
PosHNextIndexBtn=32
PosXPutGoldBtn=-1
PosYPutGoldBtn=-1
PosWPutGoldBtn=32
PosHPutGoldBtn=32
PosXTakeGoldBtn=-1
PosYTakeGoldBtn=-1
PosWTakeGoldBtn=32
PosHTakeGoldBtn=32
PosXStashNameField=-1
PosYStashNameField=-1
PosWStashNameField=175
PosHStashNameField=20
PosXStashGoldField=-1
PosYStashGoldField=-1
PosWStashGoldField=152
PosHStashGoldField=18


[STATS POINTS]
ActiveStatsUnassignment=1
KeyUsed=18

ActiveShiftClickLimit=1
LimitValueToShiftClick=10


[SKILLS POINTS]
ActiveSkillsUnassignment=1
; 1 forces every skill refund to cost 1 point. Leave 0 unless a skill costs more.
ActiveSkillsUnassignmentOneForOne=0
; -1 keeps PlugY's built-in spot for the skill refund button.
PosXUnassignSkillBtn=-1
PosYUnassignSkillBtn=-1


[STAT ON LEVEL UP]
; PlugY marks this as a cheat. 0 keeps 5 stat points per level.
ActiveStatPerLevelUp=0
StatPerLevelUp=5


[SKILL ON LEVEL UP]
; PlugY marks this as a cheat. 0 keeps 1 skill point per level.
ActiveSkillPerLevelUp=0
SkillPerLevelUp=1


[WORLD EVENT]
ActiveWorldEvent=1
ShowCounterInAllDifficulty=0
ItemsToSell=The Stone of Jordan
MonsterID=333
OwnSOJSoldChargeFor=100
InititalSOJSoldMin=200
InititalSOJSoldMax=3000
TriggerAtEachSOJSoldMin=75
TriggerAtEachSOJSoldMax=125
ActiveAutoSell=1
TimeBeforeAutoSellMin=0
TimeBeforeAutoSellMax=1200


[UBER QUEST]
ActiveUberQuest=1
UberMephistoX=25130
UberMephistoY=5143
UberDiabloX=25139
UberDiabloY=5139
UberBaalX=25139
UberBaalY=5135

ActiveUberMinions=1
UberMephistoSpawnPercent=80
UberMephistoSpawnRadius=30
UberBaalSpawnPercent=30
UberBaalSpawnRadius=30
UberDiabloSpawnPercent=30
UberDiabloSpawnRadius=30
ActiveUberDiabloRushTweekAI=1
ActiveUberBaalTeleportTweekAI=1
ActiveUberBaalChillingArmorTweekAI=1
UberBaalChillingArmorTimer=6000


[INTERFACE]
ActiveNewStatsInterface=1
SelectMainPageOnOpenning=1
; 0 hides the button plate on the main stats page.
PrintButtonsBackgroundOnMainStatsPage=1
; Extra stat rows go in PlugY\statsinterface.txt. That copy is local. The pictures stay linked.


[EXTRA] 
ActiveLaunchAnyNumberOfLOD=1
AlwaysRegenMapInSP=0
NBPlayersByDefault=1
ActiveDisplayItemLevel=1
; 0 off, 1 always show life and mana numbers, 2 off until /dlm in game.
AlwaysDisplayLifeAndManaValues=1
; 1 lets -txt read these files while Excel has them open.
EnabledTXTFilesWhenMSExcelOpenIt=1
ActiveDisplayBaseStatsValue=1
ActiveLadderRunewords=1
ActiveCowPortalWhenCowKingWasKilled=1
ActiveDoNotCloseNihlathakPortal=1
MoveCainNearHarrogathWaypoint=1
; 1.14d only. 1 removes the high-level experience penalty. 0 keeps vanilla experience.
RemoveExperienceDiminushingReturn=0

