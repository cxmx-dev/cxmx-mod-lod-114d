; cxmxdev.ini - cxmx-DEV 1.14d only. 1 = on, 0 = off. Read at game start.
; A  socketed-potion buff     B  /pot test kit
; C2 socket at ground drop    C3 socket when a potion lands on the ground
; D  Telekinesis any item (DEV only)
; E  on-screen buff meters (needs the set-unit-mode hook, which C3 also uses)
; F  Charge (skill 107) on left click works without Shift
; C (old creator hook) was removed.
[features]
A=1
B=1
C2=1
C3=1
D=1
E=1
F=1
; G=1: every class gets hard level 20 Charge, Teleport, Telekinesis (server, on join)
G=1
; I=1: Fallen King (superunique 66 + escort) once per game at the Blood Moor/Cold Plains road edge (server side)
I=1
; J=1: Fallen King mind control (BOSS-mod, server/host only). Every JCdMin-JCdMax frames (25 = 1 s) players within JRange
; subtiles are held JDur frames. JB = block relocating skills, TP scroll/tome, waypoints/portals/level warps;
; JP = drop moves away from him + pull toward him; JV = Terror overlay. J=0 turns all of it off.
J=1
JB=1
JP=0
JV=1
; JW = a move away from him becomes a walk to 6 subtiles from him (0 = just dropped). Pull: outside 8 subtiles, max 1/s.
JW=0
; JPM=1: sleepwalk - while held and >5 subtiles out you walk toward him on your own (server walk + 0x0F to your client); moves away turn toward him.
JPM=1
; JM=1: the King may pick your merc instead of you (own timer/cooldown); the merc walks toward him, stays your ally.
JM=1
; JMA=1: when he picks your merc she turns on you (game's own alignment switch) for the timer, then is put back; 0 = she walks to him.
JMA=1
JRange=20
JDurBase=125
JDurPer=25
JDurStep=3
JDurMax=250
JEndDist=0
JCdMin=200
JCdMax=300
; FQ=1: Frostquill, Coldcrow's Pet (superunique 67, blue Cold Enchanted quill rat) spawns FQDist subtiles from Coldcrow in The Cave Level 1 (server side)
FQ=1
FQDist=8
; CW=1: Cairn Stone Warden (superunique 68, grey 2x clay golem, Lightning Enchanted) spawns CWDist subtiles from Rakanishu at the Cairn Stones, Stony Field (server side)
CW=1
CWDist=12

; MG=1: Gold Find / Magic Find text (stats 79/80, all sources) on the inventory panel (own player) and the merc panel (own merc), MF below GF; client side, works for LAN guests
; MGPX/MGPY = top-left of the dark box from the inventory panel top-left (default: bottom strip right of the gold box),
; MGMX/MGMY = same for the merc panel (bottom strip left of the close button). MGPW/MGMW = max box width (wider text -> GF/MF labels).
; MGBoxPasses = how many half-transparent black layers (0 = no box, 2 = about 75% dark).
MG=1
MGPX=206
MGPY=375
MGMX=14
MGMY=375
MGPW=104
MGMW=250
MGBoxPasses=2

; PT=1: right-click another player's top-left party portrait to teleport next to them (server checks: same area only, both alive,
; not while the Fallen King holds you, max 1/s; works in LAN, the host runs it). The right-click on a portrait is not passed to the game.
PT=1

; GC=1: gold auto-pickup while charging (Charge 107, any class) and right after a Teleport jump (skill, charges or charm), server side
; (host runs it for LAN guests too). Same game routine as BaseMod [AutoPickup] (0x55C850). GCRad = radius in subtiles (10 = 2 tiles, BaseMod's),
; GCJump = subtiles moved in one frame that count as a teleport.
GC=1
GCRad=10
GCJump=6

; MeterGap: pixels between the bottom of the top-left party portraits (incl. their name labels) and the first potion meter line (E)
MeterGap=5

[basemod]
; Expected RVA of BaseMod's jump target for the item creator 0x558D90.
; 0 = learn it on the next launch. If it changes, C2 is skipped (see cxmxdev.log).
CreatorRVA=0xACF0
